# This workflow will build, test and promote to main if all succeed

name: Build, Test, and Promote to Main (.NET 8) backup

on:
  push:
    branches: ["develop"] # Trigger only when develop is updated

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to merge + push to main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Only runs if everything succeeded
      - name: Promote develop → main
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout main
          git merge origin/develop --no-ff --no-edit
          git push origin main
