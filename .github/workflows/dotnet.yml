name: Build, Test, and Promote to Main (.NET 8)

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  promote:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -b promote/develop-to-main-${{ github.sha }}
          git push origin promote/develop-to-main-${{ github.sha }}

          gh pr create \
            --base main \
            --head promote/develop-to-main-${{ github.sha }} \
            --title "Promote: develop → main (${{ github.sha }})" \
            --body "Automatic promotion from develop to main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
